
name: Pipeline CI/CD - TimiCinii

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Validar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar pagina inicial
        run: test -f paginas/index.html

      - name: Verificar pasta de imagens
        run: test -d fotos

      - name: Validar links HTML
        run: python scripts/validar_html.py

  deploy:
    name: Publicar site
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar arquivos do site
        shell: bash
        run: |
          mkdir -p public
          cp -R paginas fotos public/

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=paginas/index.html">
            <title>TimiCinii</title>
          </head>
          <body>
            <a href="paginas/index.html">Acessar TimiCinii</a>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
